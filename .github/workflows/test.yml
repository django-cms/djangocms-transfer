name: CodeCov

on: [push, pull_request]

jobs:
  clipboard-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DJANGOCMS_TRANSFER_TEST_POSTGRES: "1"
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r tests/requirements/dj61_cms51.txt "psycopg[binary]" .
      - run: pytest tests/test_clipboard.py tests/test_validation.py

  clipboard-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tools/test_clipboard.mjs

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {python-version: "3.9", requirements-file: dj42_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.10", requirements-file: dj42_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.11", requirements-file: dj42_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj42_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj42_cms41.txt, os: ubuntu-latest}

          - {python-version: "3.9", requirements-file: dj42_cms50.txt, os: ubuntu-latest}
          - {python-version: "3.10", requirements-file: dj42_cms50.txt, os: ubuntu-latest}
          - {python-version: "3.11", requirements-file: dj42_cms50.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj42_cms50.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj42_cms50.txt, os: ubuntu-latest}

          - {python-version: "3.10", requirements-file: dj50_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.11", requirements-file: dj50_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj50_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj50_cms41.txt, os: ubuntu-latest}

          - {python-version: "3.10", requirements-file: dj51_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.11", requirements-file: dj51_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj51_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj51_cms41.txt, os: ubuntu-latest}

          - {python-version: "3.10", requirements-file: dj52_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.11", requirements-file: dj52_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj52_cms41.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj52_cms41.txt, os: ubuntu-latest}

          - {python-version: "3.10", requirements-file: dj52_cms50.txt, os: ubuntu-latest}
          - {python-version: "3.11", requirements-file: dj52_cms50.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj52_cms50.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj52_cms50.txt, os: ubuntu-latest}

          - {python-version: "3.10", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.11", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.14", requirements-file: dj52_cms51.txt, os: ubuntu-latest}

          - {python-version: "3.12", requirements-file: dj60_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj60_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.14", requirements-file: dj60_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.15", requirements-file: dj60_cms51.txt, os: ubuntu-latest}

          - {python-version: "3.12", requirements-file: dj61_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj61_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.14", requirements-file: dj61_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.15", requirements-file: dj61_cms51.txt, os: ubuntu-latest}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements/${{ matrix.requirements-file }}
        pip install .

    - name: Run coverage
      run: coverage run -m pytest

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
