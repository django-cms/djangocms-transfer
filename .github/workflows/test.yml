name: CodeCov

on: [push, pull_request]

jobs:
  clipboard-javascript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node --test tools/test_clipboard.mjs

  unit-tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13"]
        requirements-file: [
          dj42_cms41.txt,
          dj50_cms41.txt,
          dj51_cms41.txt,
          dj52_cms41.txt,
          dj42_cms50.txt,
          dj50_cms50.txt,
          dj51_cms50.txt,
          dj52_cms50.txt,
        ]
        os: [
          ubuntu-latest,
        ]
        exclude:
          - requirements-file: dj50_cms41.txt
            python-version: 3.9
          - requirements-file: dj51_cms41.txt
            python-version: 3.9
          - requirements-file: dj52_cms41.txt
            python-version: 3.9
          - requirements-file: dj50_cms50.txt
            python-version: 3.9
          - requirements-file: dj51_cms50.txt
            python-version: 3.9
          - requirements-file: dj52_cms50.txt
            python-version: 3.9
        include:
          - {python-version: "3.10", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.11", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.14", requirements-file: dj52_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj60_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj60_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.14", requirements-file: dj60_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.12", requirements-file: dj61_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.13", requirements-file: dj61_cms51.txt, os: ubuntu-latest}
          - {python-version: "3.14", requirements-file: dj61_cms51.txt, os: ubuntu-latest}
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r tests/requirements/${{ matrix.requirements-file }}
        pip install .

    - name: Run coverage
      run: coverage run -m pytest

    - name: Upload Coverage to Codecov
      uses: codecov/codecov-action@v5
      with:
        token: ${{ secrets.CODECOV_TOKEN }}
