[tox]
envlist =
    py{39}-dj{42}-cms{41},
    py{310,311,312,313}-dj{42,50,51,52}-cms{41,50},
    py{310,311,312,313,314}-dj52-cms51,
    py{312,313,314,315}-dj{60,61}-cms51

skip_missing_interpreters=True

[testenv]
deps =
    -r{toxinidir}/tests/requirements/base.txt
    dj42: Django>=4.2,<5.0
    dj50: Django>=5.0,<5.1
    dj51: Django>=5.1,<5.2
    dj52: Django>=5.2,<5.3
    dj60: Django>=6.0,<6.1
    dj61: Django>=6.1,<6.2
    cms41: django-cms>=4.1,<4.2
    cms50: django-cms>=5.0,<5.1
    cms51: django-cms>=5.1,<5.2

commands =
    {envpython} --version
    {env:COMMAND:coverage} erase
    {env:COMMAND:coverage} run -m pytest
    {env:COMMAND:coverage} report
